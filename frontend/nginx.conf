server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

  # PWA: the service worker and manifest must never be served stale, or updates never reach users
  location = /sw.js            { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header Service-Worker-Allowed "/"; }
  location = /manifest.json    { add_header Cache-Control "no-cache"; }
  location = /index.html       { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }

  location ~* \.(js|css|wasm|png|jpg|svg|ttf|otf|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ /index.html; }            # SPA routes (go_router)
}
